name: Android

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # @capacitor/android's generated capacitor.build.gradle pins Java 21 source/target
      # compatibility (compileOptions), which a JDK 17 javac can't compile ("invalid source
      # release: 21") — confirmed by an actual CI run. Java 21 it is.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # GitHub's ubuntu-latest runner already ships a full Android SDK (ANDROID_HOME preset,
      # build-tools/platforms well past our compileSdkVersion/targetSdkVersion) — see
      # https://github.com/actions/runner-images. android-actions/setup-android@v3 tries to
      # install the long-removed legacy "tools" package and fails outright, so it's deliberately
      # not used here; nothing else needs installing.
      - name: Show pre-installed Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - run: npm ci

      - run: npm run build

      - run: npx cap sync android

      - run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
