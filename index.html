<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Railroads</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a0a0a;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #game-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }
      #ui {
        position: absolute;
        inset: 0;
        pointer-events: none;
        /* Respect Android safe-area insets (notches, gesture nav, display cutouts) — SPEC §10. */
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom)
          env(safe-area-inset-left);
        box-sizing: border-box;
      }
      #ui > * {
        pointer-events: auto;
      }

      /* SPEC §10.3: flat, rounded panels, semi-transparent dark bg, white text. */
      button {
        font-family: inherit;
      }

      .top-bar {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 44px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 10px;
        background: rgba(24, 28, 34, 0.88);
        color: #fff;
        font: 13px sans-serif;
      }
      .top-bar .cash {
        font-weight: 700;
        color: #f2b544;
        background: none;
        border: none;
        min-height: 32px;
        padding: 0 6px;
      }
      .top-bar .date {
        opacity: 0.9;
      }
      .top-bar .spacer {
        flex: 1;
      }
      .top-bar .speed-group {
        display: flex;
        gap: 4px;
      }
      .top-bar button {
        background: transparent;
        border: none;
        color: #fff;
        min-width: 36px;
        min-height: 32px;
        border-radius: 6px;
        font: inherit;
      }
      .top-bar button.active {
        background: #f2b544;
        color: #1e2a38;
        font-weight: 700;
      }
      .top-bar button.menu-btn {
        min-width: 44px;
        font-size: 18px;
      }

      .toolbar {
        position: absolute;
        left: 8px;
        top: 50%;
        transform: translateY(-50%);
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 6px;
        background: rgba(24, 28, 34, 0.88);
        border-radius: 10px;
      }
      .toolbar button {
        width: 44px;
        height: 44px;
        border-radius: 8px;
        border: none;
        background: transparent;
        color: #fff;
        font: 10px sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
      }
      .toolbar button.active {
        background: #f2b544;
        color: #1e2a38;
      }
      .toolbar button:disabled {
        opacity: 0.35;
      }

      .panel {
        position: absolute;
        top: 44px;
        right: 0;
        bottom: 0;
        width: min(45%, 420px);
        min-width: 260px;
        background: rgba(24, 28, 34, 0.92);
        color: #fff;
        border-radius: 8px 0 0 8px;
        box-shadow: -4px 0 16px rgba(0, 0, 0, 0.35);
        transform: translateX(100%);
        transition: transform 0.2s ease;
        overflow-y: auto;
        font: 13px sans-serif;
      }
      .panel.panel-open {
        transform: translateX(0);
      }
      .panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 14px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        position: sticky;
        top: 0;
        background: inherit;
      }
      .panel-title {
        font-size: 16px;
        font-weight: 700;
      }
      .panel-close {
        width: 32px;
        height: 32px;
        border-radius: 6px;
        border: none;
        background: rgba(255, 255, 255, 0.08);
        color: #fff;
        font-size: 14px;
      }
      .panel-body {
        padding: 12px 14px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .panel-row {
        display: flex;
        justify-content: space-between;
        gap: 8px;
      }
      .panel-row .label {
        opacity: 0.75;
      }
      .panel-section-title {
        font-weight: 700;
        margin-top: 4px;
        opacity: 0.85;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 12px;
        color: #1a1a1a;
      }

      .toast-container {
        position: absolute;
        top: 8px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        gap: 6px;
        align-items: center;
        pointer-events: none;
        z-index: 30;
      }
      .toast {
        background: rgba(24, 28, 34, 0.92);
        color: #fff;
        padding: 8px 14px;
        border-radius: 8px;
        font: 13px sans-serif;
        opacity: 0;
        transform: translateY(-8px);
        transition:
          opacity 0.2s ease,
          transform 0.2s ease;
        white-space: nowrap;
      }
      .toast-visible {
        opacity: 1;
        transform: translateY(0);
      }
      .toast-warn {
        border-left: 3px solid #e05a4f;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas"></canvas>
      <div id="ui"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
