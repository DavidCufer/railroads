<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Railroads</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a0a0a;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #game-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }
      #ui {
        position: absolute;
        inset: 0;
        pointer-events: none;
        /* Respect Android safe-area insets (notches, gesture nav, display cutouts) — SPEC §10. */
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom)
          env(safe-area-inset-left);
        box-sizing: border-box;
      }
      #ui > * {
        pointer-events: auto;
      }

      /* SPEC §10.3: flat, rounded panels, semi-transparent dark bg, white text. */
      button {
        font-family: inherit;
      }

      .top-bar {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 44px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 10px;
        background: rgba(24, 28, 34, 0.88);
        color: #fff;
        font: 13px sans-serif;
      }
      .top-bar .cash {
        font-weight: 700;
        color: #f2b544;
        background: none;
        border: none;
        min-height: 32px;
        padding: 0 6px;
      }
      .top-bar .date {
        opacity: 0.9;
      }
      .top-bar .spacer {
        flex: 1;
      }
      .top-bar .speed-group {
        display: flex;
        gap: 4px;
      }
      .top-bar button {
        background: transparent;
        border: none;
        color: #fff;
        min-width: 36px;
        min-height: 32px;
        border-radius: 6px;
        font: inherit;
      }
      .top-bar button.active {
        background: #f2b544;
        color: #1e2a38;
        font-weight: 700;
      }
      .top-bar button.menu-btn {
        min-width: 44px;
        font-size: 18px;
      }

      .toolbar {
        position: absolute;
        left: 8px;
        /* Centered within the space below the top bar (not the full viewport) so a tall toolbar
           can't creep up under the top bar on a short landscape-phone viewport. */
        top: 44px;
        bottom: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 6px;
        padding: 6px;
        background: rgba(24, 28, 34, 0.88);
        border-radius: 10px;
        max-height: calc(100% - 8px);
        box-sizing: border-box;
      }
      .toolbar button {
        width: 44px;
        height: 44px;
        border-radius: 8px;
        border: none;
        background: transparent;
        color: #fff;
        font: 10px sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
      }
      .toolbar button.active {
        background: #f2b544;
        color: #1e2a38;
      }
      .toolbar button:disabled {
        opacity: 0.35;
      }

      .panel {
        position: absolute;
        top: 44px;
        right: 0;
        bottom: 0;
        width: min(45%, 420px);
        min-width: 260px;
        background: rgba(24, 28, 34, 0.92);
        color: #fff;
        border-radius: 8px 0 0 8px;
        box-shadow: -4px 0 16px rgba(0, 0, 0, 0.35);
        transform: translateX(100%);
        transition: transform 0.2s ease;
        overflow-y: auto;
        font: 13px sans-serif;
        /* Above the quick-build toggle (z-index 6), which otherwise floats over a panel's own
           bottom-right content (e.g. Station mode's in-panel Build/Cancel row) on a short
           viewport where the panel's content reaches near the screen bottom. */
        z-index: 10;
      }
      .panel.panel-open {
        transform: translateX(0);
      }
      .panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 14px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        position: sticky;
        top: 0;
        background: inherit;
      }
      .panel-title {
        font-size: 16px;
        font-weight: 700;
      }
      .panel-close {
        width: 32px;
        height: 32px;
        border-radius: 6px;
        border: none;
        background: rgba(255, 255, 255, 0.08);
        color: #fff;
        font-size: 14px;
      }
      .panel-body {
        padding: 12px 14px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .panel-row {
        display: flex;
        justify-content: space-between;
        gap: 8px;
      }
      .panel-row .label {
        opacity: 0.75;
      }
      .panel-section-title {
        font-weight: 700;
        margin-top: 4px;
        opacity: 0.85;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 12px;
        color: #1a1a1a;
      }
      .chip-dim {
        opacity: 0.45;
      }

      /* Station mode (SPEC §6.1): type picker in the placement panel, and in-panel action/upgrade
         buttons (the floating .confirm-bar is for drag-build modes only — station placement is a
         tap, so its confirm/cancel live inside the panel itself). */
      .station-type-picker {
        display: flex;
        gap: 6px;
      }
      .station-type-btn {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        padding: 8px 4px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        background: rgba(255, 255, 255, 0.06);
        color: #fff;
        font: 12px sans-serif;
        min-height: 44px;
      }
      .station-type-btn.active {
        background: #f2b544;
        color: #1e2a38;
        border-color: #f2b544;
        font-weight: 700;
      }
      .station-type-btn:disabled {
        opacity: 0.4;
      }
      .station-type-btn .cost {
        font-weight: 700;
      }
      .panel-actions {
        display: flex;
        gap: 8px;
      }
      .panel-actions button {
        flex: 1;
        min-height: 44px;
        border-radius: 8px;
        border: none;
        font: 700 14px sans-serif;
      }
      .panel-action-build {
        background: #5bc27a;
        color: #0c2013;
      }
      .panel-action-build:disabled {
        background: #5a5f57;
        color: rgba(255, 255, 255, 0.5);
      }
      .panel-action-cancel {
        background: rgba(255, 255, 255, 0.12);
        color: #fff;
        flex: 0 0 44px;
      }
      .station-name-input {
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: #fff;
        border-radius: 6px;
        padding: 6px 8px;
        font: 14px sans-serif;
        width: 100%;
        box-sizing: border-box;
      }
      .station-upgrade-btn {
        width: 100%;
        min-height: 40px;
        border-radius: 8px;
        border: none;
        background: #4f86b5;
        color: #fff;
        font: 700 13px sans-serif;
        margin-top: 4px;
      }
      .station-upgrade-btn:disabled {
        background: #5a5f57;
        color: rgba(255, 255, 255, 0.5);
      }

      .toast-container {
        position: absolute;
        top: 8px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        gap: 6px;
        align-items: center;
        pointer-events: none;
        z-index: 30;
      }
      .toast {
        background: rgba(24, 28, 34, 0.92);
        color: #fff;
        padding: 8px 14px;
        border-radius: 8px;
        font: 13px sans-serif;
        opacity: 0;
        transform: translateY(-8px);
        transition:
          opacity 0.2s ease,
          transform 0.2s ease;
        white-space: nowrap;
      }
      .toast-visible {
        opacity: 1;
        transform: translateY(0);
      }
      .toast-warn {
        border-left: 3px solid #e05a4f;
      }

      /* Build mode HUD (SPEC §5.2): floating cost label while dragging, confirm bar on release. */
      .build-cost-label {
        position: absolute;
        pointer-events: none;
        background: rgba(24, 28, 34, 0.92);
        color: #f2b544;
        font: 700 13px sans-serif;
        padding: 5px 10px;
        border-radius: 999px;
        text-align: center;
        white-space: nowrap;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
        z-index: 20;
      }
      .build-cost-label.build-cost-blocked {
        color: #e05a4f;
      }

      .confirm-bar {
        position: absolute;
        left: 50%;
        bottom: 16px;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 8px;
        background: rgba(24, 28, 34, 0.94);
        padding: 8px;
        border-radius: 12px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
        z-index: 25;
      }
      .confirm-bar-cost {
        color: #fff;
        font: 700 15px sans-serif;
        padding: 0 8px;
        min-width: 60px;
        text-align: center;
      }
      .confirm-bar button {
        min-height: 44px;
        min-width: 44px;
        border-radius: 8px;
        border: none;
        font: 700 14px sans-serif;
        padding: 0 16px;
      }
      .confirm-bar-build {
        background: #5bc27a;
        color: #0c2013;
      }
      .confirm-bar-build:disabled {
        background: #5a5f57;
        color: rgba(255, 255, 255, 0.5);
      }
      .confirm-bar-cancel {
        background: rgba(255, 255, 255, 0.12);
        color: #fff;
        padding: 0;
      }
      .confirm-bar-bridge {
        background: rgba(255, 255, 255, 0.12);
        color: #fff;
        font-weight: 600;
      }

      .quick-build-toggle {
        position: absolute;
        right: 8px;
        bottom: 8px;
        display: flex;
        align-items: center;
        gap: 6px;
        min-height: 44px;
        padding: 0 10px;
        background: rgba(24, 28, 34, 0.88);
        border: none;
        color: rgba(255, 255, 255, 0.85);
        font: 11px sans-serif;
        border-radius: 999px;
        z-index: 6;
      }
      .quick-build-toggle .quick-build-label {
        white-space: nowrap;
      }
      .quick-build-toggle .switch {
        width: 28px;
        height: 16px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.2);
        position: relative;
      }
      .quick-build-toggle .switch::after {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #fff;
        transition: left 0.15s ease;
      }
      .quick-build-toggle.active .switch {
        background: #f2b544;
      }
      .quick-build-toggle.active .switch::after {
        left: 14px;
      }

      #debug-overlay {
        position: absolute;
        /* Clear of the toolbar's column (left:8px, ~56px wide) at any viewport height. */
        left: 68px;
        bottom: 8px;
        max-width: 46vw;
        background: rgba(24, 28, 34, 0.82);
        color: #fff;
        padding: 4px 8px;
        border-radius: 6px;
        font: 11px monospace;
        white-space: pre;
        pointer-events: none;
        z-index: 5;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas"></canvas>
      <div id="ui"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
