<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Railroads</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a0a0a;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #game-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }
      #ui {
        position: absolute;
        inset: 0;
        pointer-events: none;
        /* Respect Android safe-area insets (notches, gesture nav, display cutouts) — SPEC §10. */
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom)
          env(safe-area-inset-left);
        box-sizing: border-box;
      }
      #ui > * {
        pointer-events: auto;
      }

      /* SPEC §10.3: flat, rounded panels, semi-transparent dark bg, white text. */
      button {
        font-family: inherit;
      }

      .top-bar {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 44px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 10px;
        background: rgba(24, 28, 34, 0.88);
        color: #fff;
        font: 13px sans-serif;
      }
      .top-bar .cash {
        font-weight: 700;
        color: #f2b544;
        background: none;
        border: none;
        min-height: 32px;
        padding: 0 6px;
      }
      .top-bar .date {
        opacity: 0.9;
      }
      .top-bar .spacer {
        flex: 1;
      }
      .top-bar .speed-group {
        display: flex;
        gap: 4px;
      }
      .top-bar button {
        background: transparent;
        border: none;
        color: #fff;
        min-width: 36px;
        min-height: 32px;
        border-radius: 6px;
        font: inherit;
      }
      .top-bar button.active {
        background: #f2b544;
        color: #1e2a38;
        font-weight: 700;
      }
      .top-bar button.menu-btn {
        min-width: 44px;
        font-size: 18px;
      }

      .toolbar {
        position: absolute;
        left: 8px;
        /* Centered within the space below the top bar (not the full viewport) so a tall toolbar
           can't creep up under the top bar on a short landscape-phone viewport. */
        top: 44px;
        bottom: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 6px;
        padding: 6px;
        background: rgba(24, 28, 34, 0.88);
        border-radius: 10px;
        max-height: calc(100% - 8px);
        box-sizing: border-box;
      }
      .toolbar button {
        width: 44px;
        height: 44px;
        border-radius: 8px;
        border: none;
        background: transparent;
        color: #fff;
        font: 10px sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
      }
      .toolbar button.active {
        background: #f2b544;
        color: #1e2a38;
      }
      .toolbar button:disabled {
        opacity: 0.35;
      }

      .panel {
        position: absolute;
        top: 44px;
        right: 0;
        bottom: 0;
        width: min(45%, 420px);
        min-width: 260px;
        background: rgba(24, 28, 34, 0.92);
        color: #fff;
        border-radius: 8px 0 0 8px;
        box-shadow: -4px 0 16px rgba(0, 0, 0, 0.35);
        transform: translateX(100%);
        transition: transform 0.2s ease;
        font: 13px sans-serif;
        /* Above the quick-build toggle (z-index 6), which otherwise floats over a panel's own
           bottom-right content (e.g. Station mode's in-panel Build/Cancel row) on a short
           viewport where the panel's content reaches near the screen bottom. */
        z-index: 10;
        /* Fixed header + pinned footer, scrolling body (Phase 7.1 review fix): `.panel` is a flex
           column so `.panel-header` and `.panel-actions` sit at their natural size outside any
           scrollport, and only `.panel-body` (flex:1, min-height:0, its own overflow-y below)
           scrolls. Previously `.panel` itself was the *only* scroll container and the header used
           `position:sticky` to fake staying put — sticky doesn't remove an element from the
           document, so scrolled-past body rows could still paint through/over the "pinned" header
           (confirmed: e.g. the finance panel's "Credit limit" row landing visually on top of the
           "Finance" title after `scrollIntoView`, docs/screenshots/phase-7-finance-panel.png).
           Giving the header its own non-scrolling box makes that overlap structurally impossible
           instead of relying on stacking order. */
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .panel.panel-open {
        transform: translateX(0);
      }
      .panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 14px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        background: inherit;
        flex: 0 0 auto;
      }
      .panel-title {
        font-size: 16px;
        font-weight: 700;
      }
      .panel-close {
        width: 32px;
        height: 32px;
        border-radius: 6px;
        border: none;
        background: rgba(255, 255, 255, 0.08);
        color: #fff;
        font-size: 14px;
      }
      .panel-body {
        /* The panel's only scrolling region now (see `.panel` above) — `flex:1` fills whatever
           space `.panel-header`/`.panel-actions` don't take, `min-height:0` lets it actually
           shrink below its content's natural height instead of overflowing the flex column. */
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        /* Extra bottom padding reserves room so the sticky `.panel-actions` bar (below, still
           nested inside `.panel-body` by every caller) never visually overlaps the last row(s) of
           content — sticky positioning clamps the bar to *this* scrollport's bottom even when
           total content is only barely taller than the panel. 66px = .panel-actions' own rendered
           height (10px+12px padding + the 44px button row) — keep this and its `margin-bottom`
           below in sync if that ever changes. */
        padding: 12px 14px 66px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      /* Flexbox footgun: a flex item with non-visible overflow (e.g. `.train-car-picker`'s own
         `overflow-y:auto`) has an *automatic minimum size of 0* per the flexbox spec, so once
         `.panel-body` became height-constrained (above) instead of growing to fit its content, the
         browser shrank such children all the way to 0 height to make everything else fit — every
         car/loco/order chip picker silently disappeared (still "visible", just 0px tall) instead of
         `.panel-body` scrolling like it's supposed to. `.panel-body`'s children should never shrink
         below their natural/capped size; overflow is `.panel-body`'s own job. */
      .panel-body > * {
        flex-shrink: 0;
      }
      .panel-row {
        display: flex;
        justify-content: space-between;
        gap: 8px;
      }
      .panel-row .label {
        opacity: 0.75;
      }
      .panel-section-title {
        font-weight: 700;
        margin-top: 4px;
        opacity: 0.85;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 12px;
        color: #1a1a1a;
      }
      .chip-dim {
        opacity: 0.45;
      }

      /* Station mode (SPEC §6.1): type picker in the placement panel, and in-panel action/upgrade
         buttons (the floating .confirm-bar is for drag-build modes only — station placement is a
         tap, so its confirm/cancel live inside the panel itself). */
      .station-type-picker {
        display: flex;
        gap: 6px;
      }
      .station-type-btn {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        padding: 8px 4px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        background: rgba(255, 255, 255, 0.06);
        color: #fff;
        font: 12px sans-serif;
        min-height: 44px;
      }
      .station-type-btn.active {
        background: #f2b544;
        color: #1e2a38;
        border-color: #f2b544;
        font-weight: 700;
      }
      .station-type-btn:disabled {
        opacity: 0.4;
      }
      .station-type-btn .cost {
        font-weight: 700;
      }
      .panel-actions {
        display: flex;
        gap: 8px;
        /* Pinned to the bottom of `.panel-body`'s own scroll area (it's nested inside `.panel-body`
           by every caller, as the last item of the body list) so the confirm/build/sell button is
           always reachable on a short viewport instead of requiring a scroll past the rest of the
           panel body (Phase 5 review carry-over: the New Station panel's Build button could get
           cut off at 800×360). The negative margins reclaim `.panel-body`'s own padding so the bar
           spans edge-to-edge. */
        position: sticky;
        bottom: 0;
        margin: 8px -14px -66px;
        padding: 10px 14px 12px;
        background: rgba(24, 28, 34, 0.97);
        box-shadow: 0 -6px 10px -6px rgba(0, 0, 0, 0.4);
      }
      .panel-actions button {
        flex: 1;
        min-height: 44px;
        border-radius: 8px;
        border: none;
        font: 700 14px sans-serif;
      }
      .panel-action-build {
        background: #5bc27a;
        color: #0c2013;
      }
      .panel-action-build:disabled {
        background: #5a5f57;
        color: rgba(255, 255, 255, 0.5);
      }
      .panel-action-cancel {
        background: rgba(255, 255, 255, 0.12);
        color: #fff;
        flex: 0 0 44px;
      }
      .station-name-input {
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: #fff;
        border-radius: 6px;
        padding: 6px 8px;
        font: 14px sans-serif;
        width: 100%;
        box-sizing: border-box;
      }
      .station-upgrade-btn,
      .station-buy-train-btn {
        width: 100%;
        min-height: 40px;
        border-radius: 8px;
        border: none;
        background: #4f86b5;
        color: #fff;
        font: 700 13px sans-serif;
        margin-top: 4px;
      }
      .station-upgrade-btn:disabled {
        background: #5a5f57;
        color: rgba(255, 255, 255, 0.5);
      }

      /* Train UI (PLAN Phase 6). */
      .train-list-button {
        position: absolute;
        right: 8px;
        bottom: 60px;
        display: flex;
        align-items: center;
        gap: 4px;
        min-height: 40px;
        padding: 0 10px;
        background: rgba(24, 28, 34, 0.88);
        border: none;
        color: #fff;
        font: 12px sans-serif;
        border-radius: 999px;
        z-index: 6;
      }
      .train-loco-list,
      .train-orders-list {
        display: flex;
        flex-direction: column;
        gap: 6px;
        max-height: 96px;
        overflow-y: auto;
      }
      .train-loco-btn {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        padding: 8px 10px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        background: rgba(255, 255, 255, 0.06);
        color: #fff;
        font: 12px sans-serif;
        text-align: left;
        min-height: 40px;
      }
      .train-loco-btn.active {
        background: #f2b544;
        color: #1e2a38;
        border-color: #f2b544;
        font-weight: 700;
      }
      .train-loco-stats {
        opacity: 0.75;
        white-space: nowrap;
      }
      .train-car-picker {
        display: flex;
        flex-wrap: wrap;
        align-content: flex-start;
        gap: 6px;
        /* Phase 6 review carry-over: with all 13 cargo types available this wrapped to 4+ rows
           and, having no height cap of its own (unlike the loco/orders lists just above), pushed
           the rest of the dialog's content down far enough that its last row landed behind the
           pinned Buy button. Capping + scrolling it here keeps the whole dialog's height sane. */
        max-height: 84px;
        overflow-y: auto;
      }
      .train-car-add-btn,
      .train-car-chip {
        padding: 6px 10px;
        border-radius: 999px;
        border: none;
        color: #1a1a1a;
        font: 700 11px sans-serif;
        min-height: 32px;
      }
      .train-car-add-btn:disabled {
        opacity: 0.35;
      }
      .train-car-list {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .train-order-row {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .train-order-label {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .train-order-rule-btn {
        padding: 4px 8px;
        border-radius: 6px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        background: rgba(255, 255, 255, 0.08);
        color: #fff;
        font: 11px sans-serif;
        min-height: 30px;
      }
      .train-order-remove-btn {
        width: 28px;
        height: 28px;
        border-radius: 6px;
        border: none;
        background: rgba(224, 90, 79, 0.25);
        color: #fff;
      }
      .train-pick-station-btn {
        min-height: 40px;
        border-radius: 8px;
        border: 1px dashed rgba(255, 255, 255, 0.35);
        background: rgba(255, 255, 255, 0.06);
        color: #fff;
        font: 700 12px sans-serif;
      }
      .train-pick-station-btn.active {
        background: #f2b544;
        color: #1e2a38;
        border-style: solid;
      }
      .train-list-row {
        width: 100%;
        display: flex;
        justify-content: space-between;
        padding: 10px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.05);
        color: #fff;
        font: 13px sans-serif;
        min-height: 44px;
      }
      .train-list-status {
        opacity: 0.75;
      }

      .toast-container {
        position: absolute;
        top: 8px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        gap: 6px;
        align-items: center;
        pointer-events: none;
        z-index: 30;
      }
      .toast {
        background: rgba(24, 28, 34, 0.92);
        color: #fff;
        padding: 8px 14px;
        border-radius: 8px;
        font: 13px sans-serif;
        opacity: 0;
        transform: translateY(-8px);
        transition:
          opacity 0.2s ease,
          transform 0.2s ease;
        white-space: nowrap;
      }
      .toast-visible {
        opacity: 1;
        transform: translateY(0);
      }
      .toast-warn {
        border-left: 3px solid #e05a4f;
      }

      /* Build mode HUD (SPEC §5.2): floating cost label while dragging, confirm bar on release. */
      .build-cost-label {
        position: absolute;
        pointer-events: none;
        background: rgba(24, 28, 34, 0.92);
        color: #f2b544;
        font: 700 13px sans-serif;
        padding: 5px 10px;
        border-radius: 999px;
        text-align: center;
        white-space: nowrap;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
        z-index: 20;
      }
      .build-cost-label.build-cost-blocked {
        color: #e05a4f;
      }

      .confirm-bar {
        position: absolute;
        left: 50%;
        bottom: 16px;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 8px;
        background: rgba(24, 28, 34, 0.94);
        padding: 8px;
        border-radius: 12px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
        z-index: 25;
      }
      .confirm-bar-cost {
        color: #fff;
        font: 700 15px sans-serif;
        padding: 0 8px;
        min-width: 60px;
        text-align: center;
      }
      .confirm-bar button {
        min-height: 44px;
        min-width: 44px;
        border-radius: 8px;
        border: none;
        font: 700 14px sans-serif;
        padding: 0 16px;
      }
      .confirm-bar-build {
        background: #5bc27a;
        color: #0c2013;
      }
      .confirm-bar-build:disabled {
        background: #5a5f57;
        color: rgba(255, 255, 255, 0.5);
      }
      .confirm-bar-cancel {
        background: rgba(255, 255, 255, 0.12);
        color: #fff;
        padding: 0;
      }
      .confirm-bar-bridge {
        background: rgba(255, 255, 255, 0.12);
        color: #fff;
        font-weight: 600;
      }

      .quick-build-toggle {
        position: absolute;
        right: 8px;
        bottom: 8px;
        display: flex;
        align-items: center;
        gap: 6px;
        min-height: 44px;
        padding: 0 10px;
        background: rgba(24, 28, 34, 0.88);
        border: none;
        color: rgba(255, 255, 255, 0.85);
        font: 11px sans-serif;
        border-radius: 999px;
        z-index: 6;
      }
      .quick-build-toggle .quick-build-label {
        white-space: nowrap;
      }
      .quick-build-toggle .switch {
        width: 28px;
        height: 16px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.2);
        position: relative;
      }
      .quick-build-toggle .switch::after {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #fff;
        transition: left 0.15s ease;
      }
      .quick-build-toggle.active .switch {
        background: #f2b544;
      }
      .quick-build-toggle.active .switch::after {
        left: 14px;
      }

      /* Waiting-cargo bars (SPEC §6.3, Phase 7) — station panel. */
      .cargo-bar-row {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
      }
      .cargo-bar-label {
        width: 64px;
        flex: 0 0 64px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        opacity: 0.85;
      }
      .cargo-bar-track {
        flex: 1;
        height: 10px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.1);
        overflow: hidden;
      }
      .cargo-bar-fill {
        height: 100%;
        border-radius: 999px;
      }
      .cargo-bar-value {
        flex: 0 0 auto;
        width: 48px;
        text-align: right;
        opacity: 0.85;
        font-variant-numeric: tabular-nums;
      }

      /* Finance panel (SPEC §10.2, Phase 7). */
      .finance-loan-actions {
        gap: 8px;
      }
      .finance-loan-btn {
        flex: 1;
        min-height: 40px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        background: rgba(255, 255, 255, 0.06);
        color: #fff;
        font: 700 12px sans-serif;
      }
      .finance-loan-btn:disabled {
        opacity: 0.35;
      }
      .finance-bankrupt-warning {
        color: #e05a4f;
        font-weight: 700;
        font-size: 12px;
      }
      .finance-chart {
        width: 100%;
        height: auto;
        background: rgba(255, 255, 255, 0.04);
        border-radius: 8px;
      }
      .finance-chart-legend {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        opacity: 0.85;
      }
      .legend-dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        display: inline-block;
      }
      .ledger-net-row {
        font-weight: 700;
        border-top: 1px solid rgba(255, 255, 255, 0.12);
        padding-top: 6px;
        margin-top: 2px;
      }

      /* Yearly report dialog (Phase 7). */
      .yearly-report-headline {
        font: 700 18px sans-serif;
        text-align: center;
        padding: 8px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.06);
      }
      .yearly-report-headline.good {
        color: #5bc27a;
      }
      .yearly-report-headline.bad {
        color: #e05a4f;
      }

      #debug-overlay {
        position: absolute;
        /* Clear of the toolbar's column (left:8px, ~56px wide) at any viewport height. */
        left: 68px;
        bottom: 8px;
        max-width: 46vw;
        background: rgba(24, 28, 34, 0.82);
        color: #fff;
        padding: 4px 8px;
        border-radius: 6px;
        font: 11px monospace;
        white-space: pre;
        pointer-events: none;
        z-index: 5;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas"></canvas>
      <div id="ui"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
