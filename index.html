<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Iron & Steam</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/src/ui/theme.css" />
    <style>
      /* Phase 85: intro overlay, painted before any JS runs. Colours match the app icon and the Android splash. */
      #intro {
        position: fixed;
        inset: 0;
        z-index: 100000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2.2vh;
        background: radial-gradient(ellipse at 50% 42%, #1c4a38 0%, #0e2c20 70%);
        color: #f5ebd0;
        font-family: "Playfair Display", "Iowan Old Style", Palatino, Georgia, serif;
        transition: opacity 300ms ease-out;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom)
          env(safe-area-inset-left);
      }
      #intro.intro-out {
        opacity: 0;
        pointer-events: none;
      }
      #intro.intro-gone {
        visibility: hidden;
      }
      #intro.intro-gone * {
        animation: none !important;
      }
      /* Re-shown for a slow step: fades in after 250 ms (a compositor animation, so it runs while JS is busy). */
      #intro.intro-late {
        animation: intro-in 200ms ease-out 250ms both;
      }
      #intro svg {
        height: clamp(80px, 32vh, 260px);
        width: auto;
        overflow: visible;
      }
      .intro-title {
        margin: 0;
        font-weight: 700;
        font-size: clamp(28px, 11vh, 72px);
        line-height: 1;
        letter-spacing: 0.01em;
      }
      /* Drawn from the attribute, not as text, so the title screen's own "Iron & Steam" stays the only text match. */
      .intro-title::before {
        content: attr(data-title);
      }
      .intro-bar {
        width: clamp(160px, 38vw, 320px);
        height: 2px;
        background: rgba(201, 162, 58, 0.22);
        overflow: hidden;
      }
      .intro-bar::before {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        background: #c9a23a;
        animation: intro-bar 1.6s ease-in-out infinite;
      }
      .intro-line {
        margin: 0;
        min-height: 1.3em;
        font:
          400 clamp(12px, 3.4vh, 16px) / 1.3 system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        letter-spacing: 0.04em;
        color: #cfc4ae;
      }
      .intro-puff {
        fill: #f5ebd0;
        transform-box: fill-box;
        transform-origin: center;
        opacity: 0;
        animation: intro-puff 2.4s ease-out infinite;
      }
      .intro-puff:nth-of-type(2) {
        animation-delay: 0.8s;
      }
      .intro-puff:nth-of-type(3) {
        animation-delay: 1.6s;
      }
      .intro-engine {
        animation: intro-bob 0.9s ease-in-out infinite alternate;
      }
      @keyframes intro-puff {
        0% {
          opacity: 0;
          transform: translate(0, 0) scale(0.4);
        }
        15% {
          opacity: 0.95;
        }
        100% {
          opacity: 0;
          transform: translate(46px, -96px) scale(1.7);
        }
      }
      @keyframes intro-bar {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(250%);
        }
      }
      @keyframes intro-bob {
        to {
          transform: translateY(-1.5px);
        }
      }
      @keyframes intro-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #intro *,
        #intro {
          animation: none !important;
        }
        .intro-puff {
          opacity: 0.8;
        }
        .intro-puff:nth-of-type(2) {
          transform: translate(18px, -34px) scale(1.2);
        }
        .intro-puff:nth-of-type(3) {
          transform: translate(36px, -68px) scale(1.6);
          opacity: 0.45;
        }
        .intro-bar::before {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas"></canvas>
      <div id="ui"></div>
    </div>
    <div id="intro" role="status" aria-live="polite">

        <g class="intro-engine">
          <rect x="56" y="392" width="400" height="12" rx="4" fill="#b8892a" />
          <rect x="64" y="272" width="96" height="96" rx="10" fill="#b8892a" />
          <rect x="72" y="256" width="80" height="30" rx="10" fill="#164a31" />
          <rect x="164" y="228" width="80" height="142" fill="#e0b34e" />
          <rect x="152" y="212" width="104" height="20" rx="4" fill="#f5d98a" />
          <rect x="180" y="248" width="48" height="48" rx="8" fill="#0e2c20" />
          <path d="M244 292 Q244 272 270 272 H400 Q424 280 424 330 V370 H244Z" fill="#e0b34e" />
          <path d="M248 292 Q250 276 272 276 H410 L414 298 H248Z" fill="#f5d98a" />
          <path d="M248 272 A24 28 0 0 1 296 272Z" fill="#f5d98a" />
          <rect x="384" y="212" width="34" height="68" fill="#b8892a" />
          <rect x="372" y="192" width="60" height="24" rx="6" fill="#f5d98a" />
          <rect x="288" y="272" width="10" height="56" fill="#0e2c20" />
          <rect x="344" y="272" width="10" height="56" fill="#0e2c20" />
          <circle cx="120" cy="370" r="30" fill="#0e2c20" />
          <circle cx="120" cy="370" r="22" fill="#e0b34e" />
          <circle cx="120" cy="371" r="8" fill="#0e2c20" />
          <g fill="#e0b34e" stroke="#0e2c20" stroke-width="10">
            <circle cx="204" cy="362" r="34" />
            <circle cx="288" cy="362" r="34" />
            <circle cx="360" cy="362" r="34" />
          </g>
          <g fill="#0e2c20">
            <circle cx="204" cy="362" r="9" />
            <circle cx="288" cy="362" r="9" />
            <circle cx="360" cy="362" r="9" />
          </g>
          <rect x="204" y="359" width="156" height="6" fill="#f5d98a" />
        </g>
        <circle class="intro-puff" cx="402" cy="176" r="22" />
        <circle class="intro-puff" cx="402" cy="176" r="22" />
        <circle class="intro-puff" cx="402" cy="176" r="22" />
      </svg>
      <div
        class="intro-title"
        role="img"
        aria-label="Iron &amp; Steam"
        data-title="Iron &amp; Steam"
      ></div>
      <div class="intro-bar"></div>
      <p class="intro-line" id="intro-line">Laying track…</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
