<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Iron & Steam</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/src/ui/theme.css" />
    <style>
      /* Phase 85/86: intro overlay, painted before any JS runs (the crest; the clip starts on its own). Colours match the crest and the Android splash. */
      #intro {
        position: fixed;
        inset: 0;
        z-index: 100000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2.2vh;
        background: radial-gradient(ellipse at 50% 42%, #1c4a38 0%, #0e2c20 70%);
        color: #f5ebd0;
        font-family: "Playfair Display", "Iowan Old Style", Palatino, Georgia, serif;
        transition: opacity 300ms ease-out;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom)
          env(safe-area-inset-left);
      }
      #intro.intro-out {
        opacity: 0;
        pointer-events: none;
      }
      #intro.intro-gone {
        visibility: hidden;
      }
      #intro.intro-gone * {
        animation: none !important;
      }
      /* Re-shown for a slow step: fades in after 250 ms (a compositor animation, so it runs while JS is busy). */
      #intro.intro-late {
        animation: intro-in 200ms ease-out 250ms both;
      }
      /* Phase 86: the clip layer sits over the crest layer; it fades in when the video really plays and out at the
         end of the clip (or on tap, or when the video can't play), revealing the crest. */
      #intro-video {
        position: absolute;
        z-index: 1;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        background: #000;
        opacity: 0;
        transition: opacity 150ms linear;
        pointer-events: none;
      }
      #intro-video.intro-playing {
        opacity: 1;
      }
      #intro.intro-crest #intro-video {
        opacity: 0;
        transition: opacity 600ms ease-in-out;
      }
      .intro-crest-img {
        height: clamp(120px, 56vh, 440px);
        width: auto;
        aspect-ratio: 1;
        filter: drop-shadow(0 6px 18px rgba(0, 0, 0, 0.45));
      }
      /* The crest's banner shows the name; this stays for assistive tech (and is not text, so the title screen's own
         "Iron & Steam" stays the only text match). */
      .intro-title {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
      }
      .intro-bar {
        width: clamp(160px, 38vw, 320px);
        height: 2px;
        background: rgba(201, 162, 58, 0.22);
        overflow: hidden;
      }
      .intro-bar::before {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        background: #c9a23a;
        animation: intro-bar 1.6s ease-in-out infinite;
      }
      .intro-line {
        margin: 0;
        min-height: 1.3em;
        font:
          400 clamp(12px, 3.4vh, 16px) / 1.3 system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        letter-spacing: 0.04em;
        color: #cfc4ae;
      }
      @keyframes intro-bar {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(250%);
        }
      }
      @keyframes intro-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #intro *,
        #intro {
          animation: none !important;
        }
        .intro-bar::before {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas"></canvas>
      <div id="ui"></div>
    </div>
    <div id="intro" role="status" aria-live="polite">
      <video
        id="intro-video"
        src="/intro/arrival.webm"
        autoplay
        muted
        playsinline
        preload="auto"
        aria-hidden="true"
        onplaying="this.classList.add('intro-playing')"
      ></video>
      <img class="intro-crest-img" src="/intro/crest.png" alt="" width="512" height="512" />
      <div
        class="intro-title"
        role="img"
        aria-label="Iron &amp; Steam"
        data-title="Iron &amp; Steam"
      ></div>
      <div class="intro-bar"></div>
      <p class="intro-line" id="intro-line">Laying track…</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
