<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- Iron & Steam crest (app icon). Open with ?bg=1 (green square, the full icon) or ?bg=0 (transparent: shield + banner only). See README.md. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        background: transparent;
        font-family: Inter, Arial, sans-serif;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(2, 360px);
        gap: 30px;
        padding: 30px;
      }
      .cell {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }
      .big {
        width: 340px;
        height: 340px;
        border-radius: 62px;
        overflow: hidden;
        box-shadow: 0 8px 22px rgba(0, 0, 0, 0.3);
      }
      .row {
        display: flex;
        gap: 14px;
        align-items: center;
      }
      .small {
        width: 48px;
        height: 48px;
        border-radius: 11px;
        overflow: hidden;
      }
      .round {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        overflow: hidden;
      }
      .lbl {
        font-weight: 700;
        color: #1f2a24;
        font-size: 16px;
        text-align: center;
      }
      .sub {
        color: #4a5550;
        font-size: 12.5px;
        text-align: center;
        width: 300px;
      }
      svg {
        width: 100%;
        height: 100%;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="grid" id="g"></div>
    <script>
      const F = (k) => `
<filter id="cloud${k}" x="-30%" y="-30%" width="160%" height="160%"><feTurbulence type="fractalNoise" baseFrequency=".018" numOctaves="5" seed="${3 + k}"/><feDisplacementMap in="SourceGraphic" scale="60"/><feGaussianBlur stdDeviation="4"/></filter>
<filter id="grain${k}"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="${k}" result="n"/><feColorMatrix in="n" type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .18"/></feComponentTransfer><feComposite in2="SourceGraphic" operator="in"/><feBlend in="SourceGraphic" mode="multiply"/></filter>
<filter id="blur${k}"><feGaussianBlur stdDeviation="10"/></filter>
<filter id="blur2${k}"><feGaussianBlur stdDeviation="3"/></filter>
<filter id="glowf${k}" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="shad${k}" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-opacity=".55"/></filter>
<filter id="bevel${k}" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur in="SourceAlpha" stdDeviation="5" result="b"/><feSpecularLighting in="b" surfaceScale="6" specularConstant="1.1" specularExponent="28" lighting-color="#fff4d6" result="s"><fePointLight x="-120" y="-200" z="260"/></feSpecularLighting><feComposite in="s" in2="SourceAlpha" operator="in" result="s2"/><feComposite in="SourceGraphic" in2="s2" operator="arithmetic" k1="0" k2="1" k3=".85" k4="0"/></filter>
<linearGradient id="steel${k}" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0b0f10"/><stop offset=".22" stop-color="#3b4547"/><stop offset=".42" stop-color="#8b989b"/><stop offset=".5" stop-color="#c9d2d4"/><stop offset=".6" stop-color="#6c787b"/><stop offset=".85" stop-color="#20282a"/><stop offset="1" stop-color="#070a0b"/></linearGradient>
<radialGradient id="steelR${k}" cx=".38" cy=".32" r=".78"><stop offset="0" stop-color="#9aa6a9"/><stop offset=".25" stop-color="#4d585b"/><stop offset=".7" stop-color="#161d1f"/><stop offset="1" stop-color="#050708"/></radialGradient>
<linearGradient id="brass${k}" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5a3a0d"/><stop offset=".3" stop-color="#c8902e"/><stop offset=".48" stop-color="#ffe7a6"/><stop offset=".62" stop-color="#d9a23c"/><stop offset="1" stop-color="#4f320a"/></linearGradient>
<linearGradient id="redp${k}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d4473a"/><stop offset=".5" stop-color="#8e1f18"/><stop offset="1" stop-color="#4a0d09"/></linearGradient>
<radialGradient id="lamp${k}" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffffff"/><stop offset=".15" stop-color="#fff3c4"/><stop offset=".4" stop-color="#ffc85a" stop-opacity=".75"/><stop offset="1" stop-color="#ff9a1f" stop-opacity="0"/></radialGradient>
<radialGradient id="vig${k}" cx=".5" cy=".45" r=".75"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".6"/></radialGradient>`;

      // detailed head-on locomotive at (cx, top) scale 1 ~ 240px wide
      const headOn = (
        k,
        cx,
        ty,
        sc,
        lampOn = true,
      ) => `<g transform="translate(${cx},${ty}) scale(${sc})">
<!-- cab behind, wider and taller, with round spectacle windows -->
<path d="M-150 236 V70 Q-150 34 -110 30 H110 Q150 34 150 70 V236z" fill="#141a1b"/>
<path d="M-158 40 Q0 0 158 40 V52 Q0 14 -158 52z" fill="url(#steel${k})"/>
<circle cx="-112" cy="86" r="15" fill="#2b3638"/><circle cx="112" cy="86" r="15" fill="#2b3638"/><ellipse cx="-116" cy="81" rx="6" ry="4" fill="#9fb2b5" opacity=".55"/><ellipse cx="108" cy="81" rx="6" ry="4" fill="#9fb2b5" opacity=".55"/>
<circle cx="-112" cy="86" r="17" fill="none" stroke="url(#brass${k})" stroke-width="4"/><circle cx="112" cy="86" r="17" fill="none" stroke="url(#brass${k})" stroke-width="4"/>
<!-- driving wheels seen from the front: dark tyre faces with a polished rim and flange, standing on the rails -->
${[-1, 1].map((sd) => `<path d="M${sd * 128 - 11} 262 h22 v150 q0 8 -8 8 h-6 q-8 0 -8 -8z" fill="#101415"/><rect x="${sd * 128 - 11}" y="262" width="5" height="156" fill="#9aa6a9" opacity=".8"/><rect x="${sd * 128 + 6}" y="262" width="3" height="156" fill="#3b4547"/><path d="M${sd * 128 - 15} 404 h30 v10 h-30z" fill="#59656a"/>`).join("")}
<!-- cylinders either side -->
<rect x="-176" y="248" width="62" height="78" rx="12" fill="url(#steel${k})"/><rect x="114" y="248" width="62" height="78" rx="12" fill="url(#steel${k})"/>
<rect x="-176" y="248" width="62" height="10" rx="5" fill="#000" opacity=".45"/><rect x="114" y="248" width="62" height="10" rx="5" fill="#000" opacity=".45"/>
<!-- running plate -->
<rect x="-180" y="234" width="360" height="16" rx="3" fill="#121617"/><rect x="-180" y="234" width="360" height="4" fill="#6a7477"/>
<!-- chimney with flared lip -->
<path d="M-22 -6 h44 l6 70 h-56z" fill="url(#steel${k})"/><path d="M-34 -22 h68 q6 0 4 8 l-6 14 h-64 l-6 -14 q-2 -8 4 -8z" fill="url(#steel${k})"/>
<!-- smokebox front -->
<circle cx="0" cy="170" r="118" fill="url(#steelR${k})"/>
<circle cx="0" cy="170" r="118" fill="none" stroke="#0a0d0e" stroke-width="6"/>
<circle cx="0" cy="170" r="104" fill="none" stroke="url(#steel${k})" stroke-width="8"/>
<circle cx="0" cy="170" r="90" fill="url(#steelR${k})" opacity=".9"/>
${Array.from({ length: 20 }, (_, i) => {
  const a = (i / 20) * Math.PI * 2;
  return `<circle cx="${97 * Math.cos(a)}" cy="${170 + 97 * Math.sin(a)}" r="3.6" fill="#b9c4c7"/><circle cx="${97 * Math.cos(a) + 1}" cy="${171 + 97 * Math.sin(a)}" r="2" fill="#0b0f10"/>`;
}).join("")}
<!-- hinge straps from the left edge -->
<path d="M-92 136 H30 a8 8 0 0 1 0 12 H-92z" fill="url(#steel${k})"/><path d="M-92 192 H30 a8 8 0 0 1 0 12 H-92z" fill="url(#steel${k})"/>
<!-- central dart: hub with two crossed handles -->
<circle cx="0" cy="170" r="14" fill="url(#brass${k})"/><rect x="-26" y="166" width="52" height="8" rx="4" fill="url(#brass${k})"/><rect x="-4" y="148" width="8" height="44" rx="4" fill="url(#brass${k})" transform="rotate(35 0 170)"/>
<!-- number plate -->
<rect x="-46" y="90" width="92" height="28" rx="4" fill="#1a1a1a" stroke="url(#brass${k})" stroke-width="4"/>
<text x="0" y="111" text-anchor="middle" font-family="Playfair Display" font-weight="900" font-size="21" fill="url(#brass${k})">1830</text>
<!-- handrails -->
<path d="M-112 128 Q-122 76 -64 48" fill="none" stroke="url(#brass${k})" stroke-width="5"/><path d="M112 128 Q122 76 64 48" fill="none" stroke="url(#brass${k})" stroke-width="5"/>
<!-- frames and leading wheels under the buffer beam -->
${[-1, 1].map((sd) => `<rect x="${sd * 46 - 7}" y="330" width="14" height="70" fill="#0c0f10"/><path d="M${sd * 70 - 9} 352 h18 v60 q0 6 -6 6 h-6 q-6 0 -6 -6z" fill="#101415"/><rect x="${sd * 70 - 9}" y="352" width="4" height="64" fill="#9aa6a9" opacity=".8"/><path d="M${sd * 70 - 13} 406 h26 v8 h-26z" fill="#59656a"/>`).join("")}
<!-- buffer beam -->
<rect x="-180" y="300" width="360" height="44" rx="4" fill="url(#redp${k})"/><rect x="-180" y="300" width="360" height="6" fill="#e86a5a" opacity=".7"/>
<rect x="-160" y="310" width="26" height="24" fill="#1a1a1a"/><rect x="134" y="310" width="26" height="24" fill="#1a1a1a"/>
${[-1, 1].map((sd) => `<rect x="${sd * 147 - 15}" y="308" width="30" height="28" rx="4" fill="#1a1f20"/><circle cx="${sd * 147}" cy="322" r="27" fill="url(#steel${k})"/><circle cx="${sd * 147}" cy="322" r="27" fill="none" stroke="#0a0d0e" stroke-width="3"/><circle cx="${sd * 147}" cy="322" r="20" fill="none" stroke="#c9d2d4" stroke-width="1.5" opacity=".5"/><circle cx="${sd * 147}" cy="322" r="4" fill="#0a0d0e"/>`).join("")}
<path d="M-12 322 h24 v20 a12 12 0 0 1 -24 0z" fill="#1a1a1a"/><path d="M-6 342 q6 20 18 8" fill="none" stroke="#5a6467" stroke-width="6"/>
<!-- screw coupling on the hook, guard irons in front of the leading wheels, vacuum brake pipe -->
<path d="M-8 344 h16 v14 h-16z" fill="#1a1a1a"/>
<path d="M0 356 q-14 18 0 34 q14 -16 0 -34z" fill="none" stroke="#6a7477" stroke-width="5"/><rect x="-14" y="388" width="28" height="7" rx="3" fill="#6a7477"/>
${[-1, 1].map((sd) => `<path d="M${sd * 84} 344 v54 l${sd * -6} 14" fill="none" stroke="#232b2d" stroke-width="7" stroke-linecap="round"/>`).join("")}
<path d="M-40 344 q-6 30 -26 44" fill="none" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round"/><circle cx="-66" cy="388" r="6" fill="#3a3a3a"/>
<!-- wheels' contact shadow -->
<ellipse cx="0" cy="420" rx="170" ry="10" fill="#000" opacity=".6"/>
${lampOn ? `<!-- headlamp on a bracket in front of the chimney --><rect x="-6" y="62" width="12" height="18" fill="#1a1a1a"/><rect x="-34" y="14" width="68" height="54" rx="8" fill="#1a1a1a" stroke="url(#steel${k})" stroke-width="5"/><circle cx="0" cy="41" r="19" fill="#fffaf0"/>` : ""}
</g>`;
      const smoke = (k, x, y, s, o = 0.9, col = "#d8d4cc") =>
        `<g filter="url(#cloud${k})" opacity="${o}"><ellipse cx="${x}" cy="${y}" rx="${120 * s}" ry="${62 * s}" fill="${col}"/><ellipse cx="${x - 90 * s}" cy="${y + 20 * s}" rx="${90 * s}" ry="${50 * s}" fill="${col}"/><ellipse cx="${x + 80 * s}" cy="${y - 30 * s}" rx="${80 * s}" ry="${44 * s}" fill="${col}"/></g>`;
      // side-view train silhouette, front of the engine at x=0, rails at y=0, extending left
      const sideTrain = (fill, win) => `
<rect x="-170" y="-26" width="174" height="12" fill="${fill}"/>
<rect x="-124" y="-66" width="118" height="42" rx="18" fill="${fill}"/>
<rect x="-36" y="-92" width="16" height="30" fill="${fill}"/><rect x="-42" y="-98" width="28" height="8" rx="2" fill="${fill}"/>
<path d="M-90 -66 a12 12 0 0 1 24 0z" fill="${fill}"/>
<rect x="-172" y="-96" width="54" height="72" fill="${fill}"/><rect x="-180" y="-102" width="70" height="8" rx="2" fill="${fill}"/>
<rect x="-160" y="-86" width="26" height="22" rx="2" fill="${win}"/>
<path d="M4 -14 L22 0 L0 0z" fill="${fill}"/>
${[
  [-42, 18],
  [-82, 18],
  [-122, 18],
  [-12, 10],
  [-158, 10],
]
  .map(([x, r]) => `<circle cx="${x}" cy="-14" r="${r}" fill="${fill}"/>`)
  .join("")}
<rect x="-250" y="-62" width="74" height="48" rx="3" fill="${fill}"/>${[-236, -192].map((x) => `<circle cx="${x}" cy="-12" r="11" fill="${fill}"/>`).join("")}
${[0, 1]
  .map((i) => {
    const x0 = -360 - i * 108;
    return `<path d="M${x0} -14 v-48 q0 -10 10 -12 q44 -6 88 0 q10 2 10 12 v48z" fill="${fill}"/>${[0, 1, 2, 3].map((j) => `<rect x="${x0 + 12 + j * 22}" y="-56" width="14" height="16" rx="2" fill="${win}"/>`).join("")}${[x0 + 18, x0 + 90].map((x) => `<circle cx="${x}" cy="-12" r="11" fill="${fill}"/>`).join("")}`;
  })
  .join("")}
<rect x="-470" y="-4" width="490" height="4" fill="${fill}"/>`;
      // smoke plume rising from the chimney (chimney top at local (-28,-98)) and drifting back (left) and up
      const plume = (k, ox, oy, sc, cols) => {
        let o = `<g filter="url(#cloud${k})">`;
        for (let i = 0; i < 9; i++) {
          const t = i / 8;
          const x = ox + sc * (-28 - t * 300),
            y = oy + sc * (-104 - t * 150 + Math.sin(t * 5) * 10),
            r = sc * (12 + t * 58);
          o += `<ellipse cx="${x}" cy="${y}" rx="${r * 1.3}" ry="${r}" fill="${cols(t)}" opacity="${0.95 - t * 0.45}"/>`;
        }
        return o + "</g>";
      };
      const CREST = "../../art/icon/crest-engine-1024.png"; // the 3D engine, rendered with ?bg=crest (transparent)
      const icons = [
        ["unused", "", (k) => ``],
        [
          "2 · Game crest (3D)",
          "The same 3D engine inside the brass shield, cream-on-red banner",
          (k) => `
<radialGradient id="gb${k}" cx=".5" cy=".35" r=".85"><stop offset="0" stop-color="#1f5a43"/><stop offset=".7" stop-color="#0c3324"/><stop offset="1" stop-color="#051a12"/></radialGradient><rect width="512" height="512" fill="url(#gb${k})"/>
<clipPath id="shc${k}"><path d="M256 62 L410 112 Q416 292 256 414 Q96 292 102 112z"/></clipPath>
<g filter="url(#shad${k})">
<path d="M256 30 L440 92 Q452 310 256 452 Q60 310 72 92z" fill="url(#brass${k})" filter="url(#bevel${k})"/>
<path d="M256 52 L420 106 Q428 300 256 428 Q84 300 92 106z" fill="none" stroke="#5a3a0d" stroke-width="3"/>
<path d="M256 62 L410 112 Q416 292 256 414 Q96 292 102 112z" fill="#0b2a1e"/>
<path d="M256 62 L410 112 Q416 292 256 414 Q96 292 102 112z" fill="url(#vig${k})"/>
<g clip-path="url(#shc${k})"><image href="${CREST}" x="66" y="40" width="390" height="390"/>
<circle cx="256" cy="168" r="46" fill="url(#lamp${k})" opacity=".85"/></g>
</g>
<g filter="url(#shad${k})">
<path d="M36 380 q110 -18 220 0 q110 18 220 0 l-24 36 l24 36 q-110 18 -220 0 q-110 -18 -220 0 l24 -36z" fill="url(#redp${k})" filter="url(#bevel${k})"/>
<path d="M60 392 q98 -14 196 0 q98 14 196 0" fill="none" stroke="#000" stroke-width="2" opacity=".25"/>
<text x="256" y="428" text-anchor="middle" font-family="Playfair Display" font-weight="900" font-size="44" letter-spacing="2" fill="#ffe9b0" stroke="#3a0d09" stroke-width="2.5" paint-order="stroke">IRON &amp; STEAM</text></g>`,
        ],
      ];
      const bg = new URLSearchParams(location.search).get("bg") !== "0";
      let body = icons[1][2](1);
      if (!bg) body = body.replace(/<rect width="512" height="512" fill="url\(#gb1\)"\/>/, "");
      document.body.innerHTML = `<div id="c" style="width:1024px;height:1024px"><svg viewBox="0 0 512 512" width="1024" height="1024" xmlns="http://www.w3.org/2000/svg"><defs>${F(1)}</defs>${body}</svg></div>`;
    </script>
  </body>
</html>
